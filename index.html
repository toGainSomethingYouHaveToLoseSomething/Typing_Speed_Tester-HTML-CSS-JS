<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Your typing Speed</title>
    <meta name="description" content="Typing Speed Tester | Test Your Typing Speed | Best Typing Speed Tester">

    <link rel="apple-touch-icon" sizes="180x180" href="images/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon//favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon//favicon-16x16.png">
    <link rel="manifest" href="images/favicon//site.webmanifest">

    <link rel="stylesheet" href="style.css">

</head>

<body>
    <header>
        <nav>
            <ul>
                <li id="main-logo">
                    <h1><img src="images/logo.png" alt="logo"> Type Fast</h1>
                </li>
                <li><a href="index.html">Test</a></li>
                <li><a href="about.html">About</a></li>
                <!-- <li>
                    <button><img src="images/light_mode.png" alt=""></button>
                    <button><img src="images/dark_mode.png" alt=""></button>
                </li> -->
            </ul>
        </nav>
    </header>

    <main>
        <section id="hero-section">
            <h2>Test Your Typing Speed</h2>
            <p>Press any key to start</p>
        </section>

        <section id="app-container">
            <section id="typing">
                <div id="typing-head">
                    <ul>
                        <li id="logo"><img src="images/logo.png" alt="logo"></li>
                        <li id="dropdown">
                            <P id="timer">0:00</P>
                            <label for="time-select"><img src="images/timer.png" alt=""></label>
                            <select name="time-select" id="time-select">
                                <option value="60">1 minute</option>
                                <option value="120">2 minutes</option>
                                <option value="180">3 minutes</option>
                                <option value="300">5 minutes</option>
                            </select>
                        </li>
                        <li><button id="change-btn" onclick="changeText()">Change Text</button></li>
                        <li>
                            <button id="sound-btn" onclick="toggleSound()">
                                <img src="images/sound_on.png" alt="sound-on">
                                <!-- <img src="images/sound_off.png" alt="sound-off"> -->
                            </button>
                        </li>
                    </ul>
                </div>
                <div id="typing-body">
                    <p id="text-container">
                        <!-- from js -->
                    </p>
                </div>
            </section>

            <aside id="result-section">
                <div id="wpm" class="result-card">
                    <p class="result">0</p>
                    <p>WPM</p>
                </div>
                <div id="lpm" class="result-card">
                    <p class="result">0</p>
                    <p>LPM</p>
                </div>
                <div id="accuracy" class="result-card">
                    <p>Accuracy:</p>
                    <p class="result">0%</p>
                </div>
                <div id="total-key" class="result-card">
                    <p>Total Key Pressed:</p>
                    <p class="result">0</p>
                </div>
                <div id="wrong-key" class="result-card">
                    <p>Total Wrong Pressed:</p>
                    <p class="result">0</p>
                </div>
                <div id="right-key" class="result-card">
                    <p>Total Rigth Pressed:</p>
                    <p class="result">0</p>
                </div>
            </aside>
        </section>


        <div id="again-btn">
            <button>Test Again</button>
        </div>

    </main>

    <!-- <button onclick="start()">start</button> -->
    
    <script src="script.js"></script>
</body>

</html>
